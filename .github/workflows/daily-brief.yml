name: A股收盘简报

on:
  schedule:
    # GitHub Actions 使用 UTC。北京时间 = UTC+8
    # GitHub 原生 cron 是 best-effort：高峰期会延迟甚至静默丢弃，
    # 因此设置三个冗余触发点，靠脚本内的「当日已完成」闸门去重。
    #   07:20 UTC = 北京 15:20  主触发
    #   07:45 UTC = 北京 15:45  备用
    #   08:10 UTC = 北京 16:10  末次兜底
    - cron: '20 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '10 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（忽略当日已完成检查）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a-share-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PAGE_URL: ${{ vars.PAGE_URL || 'https://shinning-niki.github.io/a-share-brief/' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 去重闸门：history.json 中已存在今日日期 = 今天已完整跑完并推送成功。
      # 三个 cron 触发点中，第一个跑成功后续自动跳过，不会重复推送。
      - name: 去重闸门（当日是否已完成）
        id: gate
        env:
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          ARG=""
          if [ "$FORCE_INPUT" = "true" ]; then
            ARG="--force"
          fi
          OUT=$(python scripts/check_done.py $ARG)
          echo "$OUT"
          SKIP=$(echo "$OUT" | grep '^skip=' | cut -d= -f2)
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice title=已推送::今日简报已完成，本次触发跳过"
          else
            echo "::notice title=执行::今日尚未完成，继续抓取与推送"
          fi

      - name: 抓取收盘数据
        id: fetch
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scripts/fetch_brief.py
          TRADING=$(python -c "import json;print(json.load(open('data/brief.json'))['is_trading_day'])")
          echo "trading=$TRADING" >> $GITHUB_OUTPUT
          echo "交易日: $TRADING"
          if [ "$TRADING" = "False" ]; then
            echo "::notice title=休市::今日非交易日，跳过部署与推送"
          fi

      - name: 生成手机版页面
        if: steps.fetch.outputs.trading == 'True'
        run: python scripts/build_brief.py

      - name: 配置 Pages
        if: steps.fetch.outputs.trading == 'True'
        uses: actions/configure-pages@v5

      - name: 上传页面
        if: steps.fetch.outputs.trading == 'True'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deploy
        if: steps.fetch.outputs.trading == 'True'
        uses: actions/deploy-pages@v4

      - name: 推送到手机
        if: steps.fetch.outputs.trading == 'True'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/notify.py

      # 放在推送成功之后：只有完整跑完才写今日标记。
      # 中途失败时标记不存在，下一个 cron 触发点会自动重试。
      - name: 标记本日已完成
        if: steps.fetch.outputs.trading == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --quiet --cached || git commit -m "chore: 更新成交额历史 $(date +%Y-%m-%d) [skip ci]"
          git push || echo "::warning::历史文件推送失败，不影响本次简报"

      - name: 运行摘要
        if: always()
        run: |
          echo "## A股收盘简报运行记录" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式：${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 去重闸门：skip=${{ steps.gate.outputs.skip }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data/summary.md ]; then
            cat data/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "- 未生成运行摘要（抓取阶段可能异常或被跳过）" >> $GITHUB_STEP_SUMMARY
          fi
